name: Verify Xiangqi

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xiangqi-ci
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Download and verify pinned connectome release
        run: npm run data:fetch
      - name: Install pinned Rust and WASM target
        run: rustup show
      - name: Build Vercel static site with checked-in WASM
        run: npm run build:web
      - name: Verify numerical core, chess adapter and data integrity
        run: npm test
      - name: Check full-network determinism and disconnected control
        run: npm run benchmark
